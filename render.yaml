services:
  # Web Service hosting the API Gateway, React Frontend, and Android Build Engine
  - type: web
    name: web2apk
    runtime: docker
    plan: standard # 2 GB RAM, 1 vCPU (minimum required for Android SDK & Gradle compilation)
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: GRADLE_TIMEOUT_MS
        value: "600000"
      - key: JOB_TIMEOUT_MS
        value: "900000"
      - key: GRADLE_MAX_HEAP
        value: "1280m"
      - key: GRADLE_MAX_METASPACE
        value: "256m"
      - key: GRADLE_OFFLINE
        value: "false"
      - key: BUILD_CONCURRENCY
        value: "1"
