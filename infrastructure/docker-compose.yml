version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: web2apk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web2apk_db
      POSTGRES_USER: web2apk
      POSTGRES_PASSWORD: web2apk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2apk -d web2apk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: web2apk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: web2apk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: web2apk-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/web2apk-artifacts --ignore-existing;
      exit 0;
      "

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: web2apk-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://web2apk:web2apk_password@postgres:5432/web2apk_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: web2apk-artifacts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: "*"
      BUILD_CONCURRENCY: 1
      JOB_TIMEOUT_MS: 1200000
      GRADLE_TIMEOUT_MS: 900000
      GRADLE_MAX_HEAP: 2048m
      GRADLE_MAX_METASPACE: 512m
      GRADLE_OFFLINE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: web2apk-worker
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      WORKER_ID: docker-worker-01
      WORKER_CONCURRENCY: 2
      QUEUE_NAME: android-conversions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://web2apk:web2apk_password@postgres:5432/web2apk_db
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: web2apk-artifacts
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      WORKSPACE_BASE_DIR: /tmp/web2apk-builds
      BUILD_TIMEOUT_MS: 1200000
      GRADLE_TIMEOUT_MS: 900000
      GRADLE_COMPILATION_TIMEOUT_MS: 900000
      GRADLE_MAX_HEAP: 2048m
      GRADLE_MAX_METASPACE: 512m
      GRADLE_OFFLINE: "true"
      HEALTH_PORT: 4001
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
        reservations:
          cpus: '1'
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: web2apk-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
