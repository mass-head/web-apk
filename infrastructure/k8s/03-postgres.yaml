apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: web2apk
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "web2apk_db"
            - name: POSTGRES_USER
              value: "web2apk"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web2apk-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["psql", "-U", "web2apk", "-d", "web2apk_db", "-c", "SELECT 1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "web2apk", "-d", "web2apk_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: web2apk
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
