apiVersion: v1
kind: Secret
metadata:
  name: web2apk-secrets
  namespace: web2apk
type: Opaque
stringData:
  # Replace placeholders with production secrets via Secret Manager / SealedSecrets / CI
  DATABASE_URL: "postgresql://web2apk:CHANGE_ME_PRODUCTION_DB_PASSWORD@postgres-service:5432/web2apk_db"
  POSTGRES_PASSWORD: "CHANGE_ME_PRODUCTION_DB_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_PRODUCTION_REDIS_PASSWORD"
  S3_ACCESS_KEY_ID: "CHANGE_ME_PRODUCTION_AWS_ACCESS_KEY_ID"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME_PRODUCTION_AWS_SECRET_ACCESS_KEY"
  JWT_SECRET: "CHANGE_ME_32_CHARACTERS_LONG_JWT_SECRET_KEY"
  API_KEY_SECRET: "CHANGE_ME_32_CHARACTERS_LONG_ADMIN_API_KEY"
